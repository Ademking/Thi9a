<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thi9a • Bientôt disponible</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
    <link rel="manifest" href="./site.webmanifest">
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --navy: #0F172A;
            --green: #22C55E;
            --green-deep: #16a34a;
            --ink: #0F172A;
            --muted: #94a3b8;
            --soft: #f4f6f5;
            --line: #e9edeb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            height: 100%
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #fff;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100%;
            position: relative;
        }

        /* gradient wash, fading to white */
        .wash {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(900px 520px at 18% -6%, rgba(34, 197, 94, .22), transparent 60%),
                radial-gradient(820px 520px at 82% -10%, rgba(8, 145, 178, .16), transparent 60%),
                linear-gradient(180deg, rgba(34, 197, 94, .06) 0%, #fff 46%);
        }

        .wash::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(15, 23, 42, .045) 1px, transparent 1px);
            background-size: 4px 4px;
            mask-image: linear-gradient(180deg, #000, transparent 55%);
            opacity: .5
        }

        /* nav */
        nav {
            position: relative;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 26px 46px
        }

        nav img {
            height: 30px;
            width: auto;
            display: block
        }

        .tag {
            font-size: 12.5px;
            font-weight: 500;
            color: var(--green-deep);
            background: rgba(34, 197, 94, .09);
            border: 1px solid rgba(34, 197, 94, .26);
            padding: 7px 14px;
            border-radius: 100px
        }

        /* hero — anchored low-left like the reference */
        .hero {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            max-width: 1180px;
            width: 100%;
            margin: 0 auto;
            padding: 0 50px 88px
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            width: max-content;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--green-deep);
            background: rgba(34, 197, 94, .10);
            border: 1px solid rgba(34, 197, 94, .28);
            padding: 8px 15px;
            border-radius: 100px;
            margin-bottom: 26px
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 0 rgba(34, 197, 94, .5);
            animation: pulse 2.2s infinite
        }

        @keyframes pulse {
            70% {
                box-shadow: 0 0 0 8px rgba(34, 197, 94, 0)
            }

            100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0)
            }
        }

        h1 {
            font-family: 'Sora', sans-serif;
            font-size: clamp(32px, 4.6vw, 58px);
            font-weight: 700;
            line-height: 1.06;
            letter-spacing: -.03em;
            max-width: 18ch
        }

        h1 .mut {
            color: var(--muted);
            font-weight: 600
        }

        .ar {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            direction: rtl;
            font-size: clamp(16px, 2vw, 21px);
            font-weight: 600;
            color: #64748b;
            margin-top: 22px
        }

        /* cta button (green pillow) */
        .actions {
            margin-top: 34px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px
        }

        .fb-btn {
            --btn-grad-from: #2FD06A;
            --btn-grad-to: #22C55E;
            --btn-edge: 3px;
            font-family: 'Sora', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -.005em;
            color: #ffffff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 13px 22px;
            border: 0;
            border-radius: 13px;
            cursor: pointer;
            background: linear-gradient(180deg, var(--btn-grad-from), var(--btn-grad-to));
            background-clip: padding-box;
            box-shadow: 0 var(--btn-edge) 0 0 #138A40, 0 8px 20px -6px rgba(34, 197, 94, .45);
            box-shadow: 0 var(--btn-edge) 0 0 #138A40, 0 8px 20px -6px rgba(34, 197, 94, .45),
                inset 0 1px 0 0 rgba(255, 255, 255, .45), inset 0 -1px 0 0 rgba(0, 0, 0, .18);
            transition: box-shadow .2s ease-out, translate .2s ease-out, --btn-grad-from .2s, --btn-grad-to .2s;
        }

        .fb-btn:hover {
            --btn-grad-from: #37D873;
            --btn-grad-to: #2acb66;
            box-shadow: 0 var(--btn-edge) 0 0 #138A40, 0 10px 24px -6px rgba(34, 197, 94, .55),
                inset 0 1px 0 0 rgba(255, 255, 255, .55), inset 0 -1px 0 0 rgba(0, 0, 0, .18);
        }

        .fb-btn:active {
            --btn-grad-from: #1faa54;
            --btn-grad-to: #1c9e4c;
            translate: 0 var(--btn-edge);
            box-shadow: 0 0 0 0 #138A40, inset 0 1px 2px 0 rgba(0, 0, 0, .3), inset 0 -1px 0 0 rgba(255, 255, 255, .1);
        }

        .fb-btn svg {
            width: 16px;
            height: 16px;
            flex: none
        }

        .note {
            font-size: 12.5px;
            color: #9aa7b4
        }

        .note a {
            color: var(--green-deep);
            text-decoration: none;
            font-weight: 500
        }

        .note a:hover {
            text-decoration: underline
        }

        @media (max-width:760px) {
            nav {
                padding: 20px 22px
            }

            .hero {
                padding: 0 24px 56px
            }
        }

        @media (prefers-reduced-motion:reduce) {
            * {
                animation: none !important;
                transition: none !important
            }
        }
    </style>
</head>
